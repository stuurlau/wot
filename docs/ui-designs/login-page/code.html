<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>WOT - Initialize</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "on-surface": "#1a1c1c",
                        "on-tertiary-container": "#ffaea0",
                        "secondary": "#395f94",

                        "on-primary-fixed-variant": "#23501e",
                        "surface-container-highest": "#e3e2e1",

                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#bcf0ae",
                        "on-tertiary-fixed": "#400200",
                        "on-secondary-fixed-variant": "#1e477b",
                        // Custom accent for this specific request, blending with the system
                        "accent-purple": "#673f8a"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk", "sans-serif"],
                        "display": ["Space Grotesk", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"],
                        "mono": ["ui-monospace", "SFMono-Regular", "Menlo", "Monaco", "Consolas", "Liberation Mono", "Courier New", "monospace"]
                    }
                }
            }
        }

<style>
        /* Minimal grid background mimicking lab paper */
        .bg-grid-paper {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(114, 121, 110, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(114, 121, 110, 0.05) 1px, transparent 1px);
        }
        
        /* The input bottom border transition */
        .input-tech:focus {
            border-bottom-color: #673f8a !important; /* Overriding with the requested accent */
            box-shadow: none;
            outline: none;
        }

        /* Ambient glow for the main container */
        .ambient-glow {
            box-shadow: 0 10px 30px -10px rgba(103, 63, 138, 0.1);
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body antialiased min-h-screen flex flex-col items-center justify-center bg-grid-paper">
<!-- Main Container - Asymmetric and airy -->
<main class="w-full max-w-4xl px-6 md:px-12 flex flex-col md:flex-row items-stretch justify-center relative z-10">
<!-- Left Side: Brand & Intent (The "Heavy" Anchor) -->
<div class="md:w-1/2 flex flex-col justify-center mb-12 md:mb-0 pr-0 md:pr-16 relative">
<!-- decorative accent line -->
<div class="absolute left-0 top-1/4 h-1/2 w-1 bg-surface-container-high hidden md:block"></div>
<div class="pl-0 md:pl-8">
<!-- Brand Logo Placeholder -->
<div class="mb-12">
<img alt="WOT Logo" class="h-16 w-auto object-contain object-left mix-blend-multiply" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCQXAc4SsdSIWXxXypAKJczTY89flNajXbPqu57c9A9tbmmdnuz_3ziqTr4CDHpWt-h95m23YrSPuCP6kLLvvfnXpLQIz47U0xasmps9cw_vwRcj1jR_mfWiSgdAGZCRU8sl_8ebbl1yGYFamffOKGrkmwVTpYllf4Nx3GFB9TpoYXFbkE09sjNCsC7WShaMNQkQerXjsoSweuJqk70Mh0qqIElaiinH8EI2WrRmEFxSEURMJH636o7EOz_3PL__oZvYU4lI4zqAA"/>
</div>
<h1 class="font-headline text-5xl md:text-6xl font-bold tracking-tighter uppercase mb-4 text-on-surface">
                    Initialize<br/>Session
                </h1>
<p class="font-body text-outline font-semibold tracking-wide uppercase text-sm mb-8 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">terminal</span>
                    Secure Access Gateway
                </p>
<div class="space-y-4">
<p class="font-mono text-xs text-on-surface-variant flex items-start gap-2">
<span class="text-primary font-bold">&gt;</span>
                        VERIFYING ENVIRONMENT VARIABLES...
                    </p>
<p class="font-mono text-xs text-on-surface-variant flex items-start gap-2">
<span class="text-primary font-bold">&gt;</span>
                        ESTABLISHING SECURE HANDSHAKE...
                    </p>
</div>
</div>
</div>
<!-- Right Side: The Form (The "Action" Area) -->
<div class="md:w-1/2 flex flex-col justify-center">
<div class="bg-surface-container-lowest p-8 md:p-12 rounded-xl ambient-glow relative">
<!-- Ghost border overlay -->
<div class="absolute inset-0 border border-outline-variant opacity-15 rounded-xl pointer-events-none"></div>
<form action="#" class="space-y-10 relative z-10" method="POST">
<!-- Identifier Field -->
<div class="relative group">
<label class="block font-mono text-[10px] font-bold tracking-widest uppercase text-outline mb-2 transition-colors group-focus-within:text-accent-purple" for="identifier">
                            IDENTIFIER // EMAIL
                        </label>
<input class="input-tech block w-full bg-transparent border-0 border-b-2 border-outline-variant px-0 py-2 text-on-surface font-mono text-lg focus:ring-0 placeholder:text-surface-dim transition-colors rounded-none" id="identifier" name="identifier" placeholder="user@domain.xyz" required="" type="email"/>
</div>
<!-- Access Code Field -->
<div class="relative group">
<label class="block font-mono text-[10px] font-bold tracking-widest uppercase text-outline mb-2 transition-colors group-focus-within:text-accent-purple" for="access_code">
                            ACCESS_CODE // PASSWORD
                        </label>
<input class="input-tech block w-full bg-transparent border-0 border-b-2 border-outline-variant px-0 py-2 text-on-surface font-mono text-lg focus:ring-0 placeholder:text-surface-dim transition-colors rounded-none" id="access_code" name="access_code" placeholder="••••••••••••" required="" type="password"/>
</div>
<!-- Primary Action -->
<div class="pt-4">
<button class="w-full relative overflow-hidden group rounded-xl" type="submit">
<!-- Gradient background using the requested purple accent, mimicking the milled look -->
<div class="absolute inset-0 bg-gradient-to-br from-[#673f8a] to-[#4b2d66] transition-transform duration-300 group-hover:scale-105"></div>
<div class="relative px-6 py-4 flex items-center justify-between text-on-tertiary">
<span class="font-headline font-bold uppercase tracking-tight text-lg">Validate &amp; Initialize</span>
<span class="material-symbols-outlined font-light group-hover:translate-x-1 transition-transform">arrow_forward</span>
</div>
</button>
</div>
<!-- Secondary Actions -->
<div class="flex flex-col sm:flex-row justify-between items-center gap-4 pt-4 border-t border-surface-container">
<a class="font-mono text-xs font-semibold text-outline hover:text-accent-purple transition-colors uppercase tracking-widest" href="#">
                            Request Access
                        </a>
<a class="font-mono text-xs font-semibold text-outline hover:text-accent-purple transition-colors uppercase tracking-widest" href="#">
                            Recover Credentials
                        </a>
</div>
</form>
</div>
</div>
</main>
<!-- Footer System Status -->
<footer class="fixed bottom-6 left-6 md:left-12 z-50">
<div class="flex items-center gap-2 px-3 py-1.5 bg-surface-container-low rounded border border-outline-variant/30">
<span class="w-2 h-2 rounded-full bg-[#a1d494] animate-pulse"></span>
<span class="font-mono text-[10px] font-bold tracking-widest uppercase text-on-surface-variant">
                SYSTEM_STATUS: READY
            </span>
</div>
</footer>
</body></html>
