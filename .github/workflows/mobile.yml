name: mobile

# Fast checks for the Expo client on PRs and pushes (paths-filtered).
on:
  push:
    branches: [master]
    paths:
      - "mobile-client/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile-client/**"
      - ".github/workflows/mobile.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-client/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
