name: mobile-release

# Tag-triggered release build: builds the Android test APK with EAS locally
# on the runner (same as build-test-app.yml) and attaches it to a GitHub
# release for the tag, e.g. pushing `v1.0.0` creates/updates release v1.0.0
# with `wot-v1.0.0.apk`. Tags containing a "-" (v1.0.0-beta.1) become
# pre-releases. Needs the EXPO_TOKEN secret; see docs/deployment.md.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-client/package-lock.json

      # Expo SDK 54 / RN 0.81 wants JDK 17; runners ship the Android SDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The client resolves @wot/types via tsconfig paths; its zod dep must
      # be installed for both bundling and type resolution.
      - name: Install shared/types deps
        working-directory: shared/types
        run: npm ci

      - name: Build APK with EAS (local)
        working-directory: mobile-client
        run: |
          npm ci
          npx --yes eas-cli@latest build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --output "../wot-${GITHUB_REF_NAME}.apk"

      - name: Attach APK to the tag's release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: wot-${{ github.ref_name }}.apk
