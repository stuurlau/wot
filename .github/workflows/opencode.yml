name: opencode

# On-demand agent: comment `/oc <instruction>` (or `/opencode`) on any issue,
# PR, or PR review comment and opencode executes it — replying, branching off,
# or committing to the PR branch depending on context.
#
# Model ladder (see AGENTS.md): primary kimi-k3; on failure — typically
# exhausted OpenCode Go usage limits — one automatic retry with glm-5.2.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    env:
      OPENCODE_API_KEY_FALLBACK: ${{ secrets.OPENCODE_API_KEY_FALLBACK }}
    steps:
      - name: Check OPENCODE_API_KEY secret
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "::error::OPENCODE_API_KEY secret is empty or missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: "Run opencode (primary: kimi-k3)"
        id: primary
        continue-on-error: true
        # opencode retries usage-limit 429s indefinitely — cap the step so a
        # stuck primary hands over to the fallback instead of burning the job.
        timeout-minutes: 25
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/kimi-k3

      - name: "Run opencode (fallback: glm-5.2)"
        id: fallback
        continue-on-error: true
        if: steps.primary.outcome != 'success'
        timeout-minutes: 25
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/glm-5.2

      # Second OpenCode Go account (fresh per-model budgets): retry the
      # primary model with OPENCODE_API_KEY_FALLBACK. Skipped when unset.
      - name: "Run opencode (fallback key: kimi-k3)"
        id: fallbackkey
        continue-on-error: true
        if: steps.primary.outcome != 'success' && steps.fallback.outcome != 'success' && env.OPENCODE_API_KEY_FALLBACK != ''
        timeout-minutes: 25
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY_FALLBACK }}
        with:
          model: opencode-go/kimi-k3

      # All attempts failed: explain on the issue/PR and keep the run red.
      - name: Report failure
        if: steps.primary.outcome != 'success' && steps.fallback.outcome != 'success' && steps.fallbackkey.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "The agent could not complete this request. All model attempts (kimi-k3, glm-5.2, fallback key) failed — most likely the OpenCode Go usage limits are exhausted (rolling 5-hour / weekly / monthly budgets, see https://opencode.ai/auth), or a transient error occurred. To retry: re-run this workflow from the Actions tab, or post the \`/oc\` comment again." || true
          exit 1
