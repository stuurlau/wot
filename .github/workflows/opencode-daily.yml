name: opencode-daily

# Issue → PR pipeline, step 3: daily sweep of human feedback. The maintainer
# reviews agent PRs and leaves comments; the next morning this run addresses
# them (code fixes or plain answers) and pushes to the PR branch. For instant
# reaction, comment `/oc <instruction>` on the PR instead (opencode.yml).
#
# Model ladder (see AGENTS.md): primary kimi-k3; on failure — typically
# exhausted OpenCode Go usage limits — one automatic retry with glm-5.2.
on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: # manual run: Actions tab → opencode-daily → Run workflow

concurrency:
  group: opencode-daily
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    env:
      OPENCODE_API_KEY_FALLBACK: ${{ secrets.OPENCODE_API_KEY_FALLBACK }}
      PROMPT: |
        You are the daily maintenance agent for the WOT repo. Address pending human feedback on agent-authored PRs. Read `AGENTS.md` at the repo root first and follow it.

        Process:
        1. List open PRs whose head branch starts with `opencode/` (e.g. `gh pr list --state open --json number,headRefName,title`).
        2. For each PR, fetch reviews, review comments and issue comments (`gh pr view` / `gh api`). Skip the PR when there are no human comments newer than the last bot commit or bot comment — nothing to do.
        3. For each PR with pending feedback: check out its branch, read ALL unresolved review threads, and address each one — fix the code, or reply explaining why no change is needed. Answer questions with a reply, not code changes.
        4. Run `make setup`, then the checks for every package you touched (`make check` covers all). Fix failures until green.
        5. Commit fixes as small conventional commits and push to the PR branch, then leave exactly one comment on the PR summarizing how each piece of feedback was handled.
        6. Process each PR this way, one at a time, then stop.

        Rules:
        - Only touch `opencode/` branches. Never push to `master`. Never force-push.
        - If no PR has pending feedback, end the session without changing anything.
    steps:
      - name: Check OPENCODE_API_KEY secret
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "::error::OPENCODE_API_KEY secret is empty or missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: "Run opencode (primary: kimi-k3)"
        id: primary
        continue-on-error: true
        # opencode retries usage-limit 429s indefinitely — cap the step so a
        # stuck primary hands over to the fallback instead of burning the job.
        timeout-minutes: 25
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/kimi-k3
          prompt: ${{ env.PROMPT }}

      - name: "Run opencode (fallback: glm-5.2)"
        id: fallback
        continue-on-error: true
        if: steps.primary.outcome != 'success'
        timeout-minutes: 25
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/glm-5.2
          prompt: ${{ env.PROMPT }}

      # Second OpenCode Go account (fresh per-model budgets): retry the
      # primary model with OPENCODE_API_KEY_FALLBACK. Skipped when unset.
      - name: "Run opencode (fallback key: kimi-k3)"
        id: fallbackkey
        continue-on-error: true
        if: steps.primary.outcome != 'success' && steps.fallback.outcome != 'success' && env.OPENCODE_API_KEY_FALLBACK != ''
        timeout-minutes: 25
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY_FALLBACK }}
        with:
          model: opencode-go/kimi-k3
          prompt: ${{ env.PROMPT }}

      # Scheduled run: no issue to comment on — just keep the run red.
      - name: Report failure
        if: steps.primary.outcome != 'success' && steps.fallback.outcome != 'success' && steps.fallbackkey.outcome != 'success'
        run: |
          echo "::error::All model attempts (kimi-k3, glm-5.2, fallback key) failed — most likely exhausted OpenCode Go usage limits (see https://opencode.ai/auth) or a transient error. Re-run from the Actions tab."
          exit 1
