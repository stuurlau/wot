name: opencode-implement

# Issue → PR pipeline, step 1: labeling an issue `agent` (or opening an issue
# that already has the label) dispatches the implementer. It branches off
# master, implements the issue, runs checks, and opens exactly one PR with
# `Closes #N` in the body. Requires the `agent` label to exist in the repo
# (create once: GitHub UI or `gh label create agent`).
#
# Single model: kimi-k3, capped at 25 min. The repo `opencode.json` denies
# `external_directory`, so out-of-workspace reads fail fast instead of
# hanging on an unanswerable permission prompt; opencode still retries
# usage-limit 429s indefinitely — the cap turns that into a failure instead
# of burning the job. No model fallbacks: observed outages were gateway-wide,
# so retrying with another model/key just burned budget and CI time.
# Retry by re-running.
on:
  issues:
    types: [opened, labeled]

concurrency:
  group: opencode-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: contains(github.event.issue.labels.*.name, 'agent')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    env:
      PROMPT: |
        You are the implementer agent for the WOT repo. Implement issue #${{ github.event.issue.number }}, end to end.

        Git is managed for you: the branch was already created from `master`, and after you finish, the infrastructure pushes your commits and opens the PR (targeting `master`, with `Closes #${{ github.event.issue.number }}`). Never create, switch, or rename branches, never push, never open a pull request — if the branch changes mid-session, the PR is silently skipped.

        Process:
        1. Read `AGENTS.md` at the repo root first and follow it. Read the issue title, body and all comments. If the requirements are ambiguous in a way that changes the design, ask concrete questions in an issue comment and stop — do not guess.
        2. Implement the smallest change that fully satisfies the issue. Follow existing code conventions; no unrelated refactors.
        3. Run `make setup`, then the checks for every package you touched (`make check` covers all). Fix failures until green.
        4. Commit your changes on the current branch with a clear conventional commit message. Your final message should summarize: changes, which checks you ran and their results, and anything you deliberately left out.

        Rules:
        - Never commit secrets; add new env variables as documented placeholders only.
        - Stay inside the checked-out workspace — never read or write paths outside it (`~/.gitconfig`, `~/.config/gh`, ...); git and `gh` are pre-configured.
        - For big behavior or architecture changes, add a dated doc in `docs/` (see AGENTS.md).
    steps:
      - name: Check OPENCODE_API_KEY secret
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "::error::OPENCODE_API_KEY secret is empty or missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: "Run opencode"
        id: primary
        # opencode retries usage-limit 429s indefinitely — cap the step so an
        # exhausted budget fails the run instead of burning the whole job.
        timeout-minutes: 25
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/kimi-k3
          prompt: ${{ env.PROMPT }}

      # On failure: explain on the issue and keep the run red.
      - name: Report failure
        if: steps.primary.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "The agent could not complete this task (see the run log). Most likely an OpenCode Go outage/hang or exhausted usage limits (rolling 5-hour / weekly / monthly budgets — https://opencode.ai/auth). To retry: re-run this workflow from the Actions tab, or remove and re-add the \`agent\` label." || true
          exit 1
