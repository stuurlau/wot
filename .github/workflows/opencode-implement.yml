name: opencode-implement

# Issue → PR pipeline, step 1: labeling an issue `agent` (or opening an issue
# that already has the label) dispatches the implementer. It branches off
# master, implements the issue, runs checks, and opens exactly one PR with
# `Closes #N` in the body. Requires the `agent` label to exist in the repo
# (create once: GitHub UI or `gh label create agent`).
#
# Model ladder (see AGENTS.md): primary kimi-k3; on failure — typically
# exhausted OpenCode Go usage limits, K3 has the smallest budget — one
# automatic retry with glm-5.2 (4x the monthly budget).
on:
  issues:
    types: [opened, labeled]

concurrency:
  group: opencode-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: contains(github.event.issue.labels.*.name, 'agent')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    env:
      OPENCODE_API_KEY_FALLBACK: ${{ secrets.OPENCODE_API_KEY_FALLBACK }}
      PROMPT: |
        You are the implementer agent for the WOT repo. Implement issue #${{ github.event.issue.number }}, end to end.

        Git is managed for you: the branch was already created from `master`, and after you finish, the infrastructure pushes your commits and opens the PR (targeting `master`, with `Closes #${{ github.event.issue.number }}`). Never create, switch, or rename branches, never push, never open a pull request — if the branch changes mid-session, the PR is silently skipped.

        Process:
        1. Read `AGENTS.md` at the repo root first and follow it. Read the issue title, body and all comments. If the requirements are ambiguous in a way that changes the design, ask concrete questions in an issue comment and stop — do not guess.
        2. Implement the smallest change that fully satisfies the issue. Follow existing code conventions; no unrelated refactors.
        3. Run `make setup`, then the checks for every package you touched (`make check` covers all). Fix failures until green.
        4. Commit your changes on the current branch with a clear conventional commit message. Your final message should summarize: changes, which checks you ran and their results, and anything you deliberately left out.

        Rules:
        - Never commit secrets; add new env variables as documented placeholders only.
        - For big behavior or architecture changes, add a dated doc in `docs/` (see AGENTS.md).
    steps:
      - name: Check OPENCODE_API_KEY secret
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "::error::OPENCODE_API_KEY secret is empty or missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: "Run opencode (primary: kimi-k3)"
        id: primary
        continue-on-error: true
        # opencode retries usage-limit 429s indefinitely — cap the step so a
        # stuck primary hands over to the fallback instead of burning the job.
        timeout-minutes: 25
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/kimi-k3
          prompt: ${{ env.PROMPT }}

      - name: "Run opencode (fallback: glm-5.2)"
        id: fallback
        continue-on-error: true
        if: steps.primary.outcome != 'success'
        timeout-minutes: 25
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/glm-5.2
          prompt: ${{ env.PROMPT }}

      # Second OpenCode Go account (fresh per-model budgets): retry the
      # primary model with OPENCODE_API_KEY_FALLBACK. Skipped when unset.
      - name: "Run opencode (fallback key: kimi-k3)"
        id: fallbackkey
        continue-on-error: true
        if: steps.primary.outcome != 'success' && steps.fallback.outcome != 'success' && env.OPENCODE_API_KEY_FALLBACK != ''
        timeout-minutes: 25
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY_FALLBACK }}
        with:
          model: opencode-go/kimi-k3
          prompt: ${{ env.PROMPT }}

      # All attempts failed: explain on the issue and keep the run red.
      - name: Report failure
        if: steps.primary.outcome != 'success' && steps.fallback.outcome != 'success' && steps.fallbackkey.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "The agent could not complete this task. All model attempts (kimi-k3, glm-5.2, fallback key) failed — most likely the OpenCode Go usage limits are exhausted (rolling 5-hour / weekly / monthly budgets, see https://opencode.ai/auth), or a transient error occurred. To retry: re-run this workflow from the Actions tab, or remove and re-add the \`agent\` label." || true
          exit 1
