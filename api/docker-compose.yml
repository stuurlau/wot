services:
  db:
    image: postgres:17-alpine
    container_name: wot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wot
      POSTGRES_PASSWORD: wot_dev_password
      POSTGRES_DB: wot_dev
    ports:
      - "5432:5432"
    volumes:
      - wot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wot -d wot_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wot-pgdata:
